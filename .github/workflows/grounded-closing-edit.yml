name: Ground the closing slides

on:
  push:
    branches:
      - feature/grounded-closing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit-and-build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/grounded-closing
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Materialize grounded closing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/index.tsx')
          s = p.read_text()
          s = s.replace(
              'const slideIds = ["cover", "top", "evidence", "commodity", "crowd", "embodiment", "energy", "longevity", "work", "human", "navigator", "today", "markets", "consulting", "bet", "end"];',
              'const slideIds = ["cover", "top", "evidence", "commodity", "crowd", "embodiment", "energy", "longevity", "work", "human", "navigator", "today", "markets", "consulting", "end"];'
          )

          old = '''      <section className="panel panel-dark implications-panel value-chain-panel" id="consulting">
        <div className="implications-kicker">12 / THE CONSULTING SHIFT</div>
        <h2 className="implications-title">The value moves<br /><span>upstream.</span></h2>
        <div className="value-chain-block yesterday"><span>YESTERDAY</span><div>DPR <i>→</i> RFP <i>→</i> PROCUREMENT <i>→</i> PMU <i>→</i> IMPLEMENTATION</div></div>
        <div className="value-chain-divider">↓</div>
        <div className="value-chain-block tomorrow"><span>TOMORROW</span><div>FORESIGHT <i>→</i> STRATEGY <i>→</i> ARCHITECTURE <i>→</i> GOVERNANCE <i>→</i> ASSURANCE <i>→</i> TRANSFORMATION</div></div>
        <p className="value-chain-payoff">When intelligence becomes abundant,<br /><strong>judgement moves up the value chain.</strong></p>
      </section>

      <section className="panel panel-lime implications-panel bet-panel" id="bet">
        <div className="implications-kicker dark">13 / THE QUESTION FOR THE ROOM</div>
        <h2 className="bet-question">If these shifts are real…<br /><span>where should we place our next big bet?</span></h2>
        <div className="bet-grid">
          <span>CAPABILITIES</span><span>SOLUTIONS</span><span>ALLIANCES</span><span>IP</span><span>NEW MARKETS</span><span>NEW ADVISORY</span>
        </div>
      </section>
'''

          new = '''      <section className="panel panel-dark implications-panel practice-build-panel" id="consulting">
        <div className="implications-kicker">12 / THE PRACTICE RESPONSE</div>
        <h2 className="practice-build-title">What should we<br /><span>build now?</span></h2>
        <div className="practice-build-grid">
          <article className="practice-build-card">
            <small>01 / DECISION INTELLIGENCE</small>
            <h3>Design the layer<br />above the systems.</h3>
            <p>Cameras, sensors, drones, command centres and policing systems increasingly need an intelligence layer that connects signals to decisions.</p>
          </article>
          <article className="practice-build-card">
            <small>02 / AUTONOMY ASSURANCE</small>
            <h3>Govern systems<br />that can act.</h3>
            <p>Help clients set the controls, accountability and operating boundaries for systems that increasingly sense, decide and act on their own.</p>
          </article>
          <article className="practice-build-card">
            <small>03 / AI-NATIVE OPERATIONS</small>
            <h3>Redesign work<br />around agents.</h3>
            <p>Redesign workflows, roles and decision rights around humans working with agents rather than simply adding AI to existing processes.</p>
          </article>
        </div>
        <p className="practice-build-payoff">These are not new markets.<br /><strong>They are the next layer of the markets we already know.</strong></p>
      </section>
'''

          if old not in s:
              raise SystemExit('closing block not found')
          s = s.replace(old, new)
          p.write_text(s)

          Path('src/styles/presentation-consulting.css').write_text('''/* Consulting implications — grounded closing sequence. */
.site-shell>#today{order:12!important}.site-shell>#markets{order:13!important}.site-shell>#consulting{order:14!important}.site-shell>#end{order:15!important}
.implications-panel{overflow:hidden}.implications-kicker{font:11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:28px}.implications-kicker.dark{color:var(--ink)}.implications-title{font:600 clamp(46px,6.7vw,98px)/.94 'Space Grotesk',sans-serif;letter-spacing:-.078em;margin:0;max-width:1100px}.implications-title span{color:#9b9d95}.implications-title.dark{color:var(--ink)}.implications-title.dark span{color:#676861}
.market-shift-panel{background:#dfddd4;color:var(--ink)}.market-domain{margin:18px 0 0;font:11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:#676861}.market-shifts{margin-top:22px;border-top:2px solid var(--ink)}.market-shifts>div{display:grid;grid-template-columns:46px minmax(180px,.9fr) 60px minmax(260px,1.35fr);align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid rgba(17,19,23,.2)}.market-shifts small{font:10px 'DM Mono',monospace;color:#777872}.market-shifts strong{font:600 clamp(14px,1.35vw,20px) 'DM Mono',monospace;letter-spacing:-.04em}.market-shifts i{font-style:normal;font-size:30px;color:var(--red)}.market-shifts b{font:650 clamp(19px,2.05vw,31px)/1 'Space Grotesk',sans-serif;letter-spacing:-.045em}.market-payoff{margin:34px 0 0 auto;max-width:760px;text-align:right;font:500 clamp(26px,3.5vw,52px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-.055em}.market-payoff em{font-style:normal;color:#6f706a}.market-payoff strong{color:var(--red)}
.practice-build-panel{justify-content:center}.practice-build-title{font:620 clamp(48px,6.7vw,96px)/.92 'Space Grotesk',sans-serif;letter-spacing:-.078em;margin:0;max-width:1050px}.practice-build-title span{color:var(--lime)}.practice-build-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:rgba(242,239,231,.16);margin-top:38px;border:1px solid rgba(242,239,231,.16)}.practice-build-card{background:#111317;padding:26px 24px 24px;min-height:250px;display:flex;flex-direction:column}.practice-build-card small{font:10px 'DM Mono',monospace;letter-spacing:.11em;color:var(--lime)}.practice-build-card h3{font:600 clamp(24px,2.65vw,38px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.055em;margin:22px 0 18px;color:#f2efe7}.practice-build-card p{font:400 clamp(13px,1.15vw,17px)/1.45 'Space Grotesk',sans-serif;color:#a9aaa4;margin:auto 0 0;max-width:34ch}.practice-build-payoff{margin:34px 0 0;font:500 clamp(24px,3vw,42px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-.05em;color:#a9aaa4;max-width:980px}.practice-build-payoff strong{color:#f2efe7;font-weight:600}
@media(max-height:820px) and (min-width:901px){.practice-build-title{font-size:clamp(42px,5.7vw,76px)}.practice-build-grid{margin-top:24px}.practice-build-card{min-height:205px;padding:20px}.practice-build-card h3{margin:16px 0 12px;font-size:clamp(22px,2.25vw,32px)}.practice-build-card p{font-size:13px;line-height:1.35}.practice-build-payoff{margin-top:22px;font-size:clamp(21px,2.5vw,32px)}}
@media(max-width:900px){.market-shifts>div{grid-template-columns:32px 1fr 34px 1.35fr;gap:10px}.practice-build-grid{grid-template-columns:1fr}.practice-build-card{min-height:0}.practice-build-payoff{margin-top:22px}}
@media(max-width:650px){.market-shifts>div{grid-template-columns:28px 1fr}.market-shifts i{display:none}.market-shifts b{grid-column:2}.market-payoff{text-align:left}.practice-build-grid{margin-top:24px}.practice-build-card{padding:18px}.practice-build-card h3{font-size:24px;margin:12px 0 10px}.practice-build-card p{font-size:12px}.practice-build-payoff{font-size:22px}}
''')
          PY

      - name: Build
        run: |
          bun install --no-frozen-lockfile
          bunx vite build --config vite.gh.config.ts

      - name: Verify closing structure
        run: |
          grep -q '"markets", "consulting", "end"' src/routes/index.tsx
          ! grep -q 'id="bet"' src/routes/index.tsx
          grep -q '01 / DECISION INTELLIGENCE' src/routes/index.tsx
          grep -q '02 / AUTONOMY ASSURANCE' src/routes/index.tsx
          grep -q '03 / AI-NATIVE OPERATIONS' src/routes/index.tsx

      - name: Commit branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/styles/presentation-consulting.css
          git commit -m "Ground the Meta Trends closing" || exit 0
          git push origin HEAD:feature/grounded-closing
