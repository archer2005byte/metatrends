name: Materialize consulting branch

on:
  push:
    branches:
      - feature/consulting-implications

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/consulting-implications
          fetch-depth: 0

      - name: Materialize consulting slides in source
        run: python scripts/materialize-consulting-branch.py

      - name: Commit clean branch source
        run: |
          if git diff --quiet --exit-code; then
            echo "Nothing to materialize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize consulting implications in branch source"
          git push origin HEAD:feature/consulting-implications
