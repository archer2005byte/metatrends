name: Finalize grounded closing

on:
  push:
    branches:
      - feature/grounded-closing

permissions:
  contents: write

jobs:
  edit_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/grounded-closing
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Amend closing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/routes/index.tsx")
          text = path.read_text()
          text = text.replace(
              'const slideIds = ["cover", "top", "evidence", "commodity", "crowd", "embodiment", "energy", "longevity", "work", "human", "navigator", "today", "markets", "consulting", "end"];',
              'const slideIds = ["cover", "top", "evidence", "commodity", "crowd", "embodiment", "energy", "longevity", "work", "human", "navigator", "today", "consulting", "end"];'
          )

          market = re.compile(r'\n      <section className="panel market-shift-panel implications-panel" id="markets">.*?</section>\n\n      <section className="panel panel-dark implications-panel practice-build-panel" id="consulting">', re.S)
          text, n = market.subn('\n      <section className="panel panel-dark implications-panel practice-build-panel" id="consulting">', text, count=1)
          if n != 1:
              raise SystemExit("market slide removal failed")

          practice = re.compile(r'      <section className="panel panel-dark implications-panel practice-build-panel" id="consulting">.*?</section>\n<section className=\{`panel end-panel', re.S)
          replacement = '''      <section className="panel panel-dark implications-panel practice-build-panel" id="consulting">
        <div className="implications-kicker">11 / THE PRACTICE RESPONSE</div>
        <h2 className="practice-build-title">What should we<br /><span>build next?</span></h2>
        <div className="practice-build-grid">
          <article className="practice-build-card">
            <small>01 / CLOSED-LOOP OPERATIONS</small>
            <h3>Move from informing action<br />to initiating it.</h3>
            <p>Systems already sense, fuse and present. The next step is to recommend, trigger and coordinate response within defined operating limits.</p>
          </article>
          <article className="practice-build-card">
            <small>02 / AUTONOMY ASSURANCE</small>
            <h3>Govern systems<br />that can act.</h3>
            <p>Define authority, human override, accountability, auditability and operating boundaries for increasingly autonomous systems.</p>
          </article>
          <article className="practice-build-card">
            <small>03 / AGENTIC OPERATIONS</small>
            <h3>Redesign work<br />around agents.</h3>
            <p>Redesign workflows, roles and decision rights around humans supervising and collaborating with software agents.</p>
          </article>
        </div>
        <p className="practice-build-payoff">These are not new markets.<br /><strong>They are the next layer of the markets we already know.</strong></p>
      </section>
<section className={`panel end-panel'''
          text, n = practice.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit("practice slide replacement failed")
          path.write_text(text)

          css = """/* Grounded closing sequence. */
.site-shell>#today{order:12!important}.site-shell>#consulting{order:13!important}.site-shell>#end{order:14!important}
.implications-panel{overflow:hidden}.implications-kicker{font:11px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:28px}
.practice-build-panel{justify-content:center}.practice-build-title{font:620 clamp(48px,6.7vw,96px)/.92 'Space Grotesk',sans-serif;letter-spacing:-.078em;margin:0;max-width:1050px}.practice-build-title span{color:var(--lime)}.practice-build-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:rgba(242,239,231,.16);margin-top:38px;border:1px solid rgba(242,239,231,.16)}.practice-build-card{background:#111317;padding:26px 24px 24px;min-height:250px;display:flex;flex-direction:column}.practice-build-card small{font:10px 'DM Mono',monospace;letter-spacing:.11em;color:var(--lime)}.practice-build-card h3{font:600 clamp(24px,2.65vw,38px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.055em;margin:22px 0 18px;color:#f2efe7}.practice-build-card p{font:400 clamp(13px,1.15vw,17px)/1.45 'Space Grotesk',sans-serif;color:#a9aaa4;margin:auto 0 0;max-width:36ch}.practice-build-payoff{margin:34px 0 0;font:500 clamp(24px,3vw,42px)/1.04 'Space Grotesk',sans-serif;letter-spacing:-.05em;color:#a9aaa4;max-width:980px}.practice-build-payoff strong{color:#f2efe7;font-weight:600}
@media(max-height:820px) and (min-width:901px){.practice-build-title{font-size:clamp(42px,5.7vw,76px)}.practice-build-grid{margin-top:24px}.practice-build-card{min-height:205px;padding:20px}.practice-build-card h3{margin:16px 0 12px;font-size:clamp(22px,2.25vw,32px)}.practice-build-card p{font-size:13px;line-height:1.35}.practice-build-payoff{margin-top:22px;font-size:clamp(21px,2.5vw,32px)}}
@media(max-width:900px){.practice-build-grid{grid-template-columns:1fr}.practice-build-card{min-height:0}.practice-build-payoff{margin-top:22px}}
@media(max-width:650px){.practice-build-grid{margin-top:24px}.practice-build-card{padding:18px}.practice-build-card h3{font-size:24px;margin:12px 0 10px}.practice-build-card p{font-size:12px}.practice-build-payoff{font-size:22px}}
"""
          Path("src/styles/presentation-consulting.css").write_text(css)
          PY

      - name: Build
        run: |
          bun install --no-frozen-lockfile
          bunx vite build --config vite.gh.config.ts

      - name: Verify
        run: |
          grep -q '"today", "consulting", "end"' src/routes/index.tsx
          test "$(grep -c 'id="markets"' src/routes/index.tsx)" -eq 0
          grep -q '01 / CLOSED-LOOP OPERATIONS' src/routes/index.tsx
          grep -q '02 / AUTONOMY ASSURANCE' src/routes/index.tsx
          grep -q '03 / AGENTIC OPERATIONS' src/routes/index.tsx

      - name: Commit branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/styles/presentation-consulting.css
          git commit -m "Tighten grounded practice closing" || exit 0
          git push origin HEAD:feature/grounded-closing
