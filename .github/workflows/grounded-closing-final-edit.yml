name: Finalize grounded closing

on:
  push:
    branches:
      - feature/grounded-closing

permissions:
  contents: write

jobs:
  edit_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/grounded-closing
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - name: Amend closing
        run: echo '' | base64 -d | python3
      - name: Build
        run: bun install --no-frozen-lockfile && bunx vite build --config vite.gh.config.ts
      - name: Verify
        run: grep -q '"today", "consulting", "end"' src/routes/index.tsx && test "$(grep -c 'id="markets"' src/routes/index.tsx)" -eq 0 && grep -q '01 / CLOSED-LOOP OPERATIONS' src/routes/index.tsx && grep -q '02 / AUTONOMY ASSURANCE' src/routes/index.tsx && grep -q '03 / AGENTIC OPERATIONS' src/routes/index.tsx
      - name: Commit branch changes
        run: git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add src/routes/index.tsx src/styles/presentation-consulting.css && (git commit -m 'Tighten grounded practice closing' || true) && git push origin HEAD:feature/grounded-closing
