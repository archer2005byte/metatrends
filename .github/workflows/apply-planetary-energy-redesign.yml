name: Apply planetary energy redesign

on:
  push:
    branches:
      - feature/consulting-implications

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/consulting-implications

      - name: Apply redesign
        run: python3 .github/scripts/apply_planetary.py

      - name: Commit materialized redesign
        run: |
          rm .github/workflows/apply-planetary-energy-redesign.yml
          rm .github/scripts/apply_planetary.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add planetary systems energy reveal"
          git push origin HEAD:feature/consulting-implications
