name: Finalize Meta Trends branch

on:
  push:
    branches: [feature/consulting-implications]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/consulting-implications
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync main
        run: |
          git fetch origin main
          git merge origin/main --no-edit -X theirs

      - name: Apply finalization script
        run: python3 .github/scripts/finalize_metatrends.py

      - name: Build
        env:
          GITHUB_PAGES_BASE: /
        run: |
          bun install --no-frozen-lockfile
          bunx vite build --config vite.gh.config.ts
          if [ -f dist-gh/index.gh.html ]; then mv dist-gh/index.gh.html dist-gh/index.html; fi
          cp dist-gh/index.html dist-gh/404.html
          mkdir -p dist-gh/resources
          cp dist-gh/index.html dist-gh/resources/index.html
          cp -r public/. dist-gh/ 2>/dev/null || true

      - name: Static checks
        run: |
          ! grep -q 'THE BENCHMARK TREADMILL' src/routes/index.tsx
          ! grep -q 'TOKEN ECONOMICS' src/routes/index.tsx
          ! grep -q '00—11\|01—12' src/routes/index.tsx
          grep -q 'ANSWER → REASON → SEE → ACT → PERSIST → COORDINATE' src/routes/index.tsx
          grep -q 'CONSERVE → REPLICATE → PARALLELISE → WASTE' src/routes/index.tsx
          grep -q 'planned to enter human clinical trials in 2027' src/routes/index.tsx
          grep -q 'The Hugging Face incident and the road ahead' src/lib/reading-list.ts
          grep -q 'presentation-thesis-reveals.css' src/styles.css

      - name: Install Chromium
        run: npx -y playwright@1.55.0 install --with-deps chromium

      - name: Serve build
        run: |
          python3 -m http.server 4173 --directory dist-gh >/tmp/metatrends-http.log 2>&1 &
          sleep 2

      - name: Viewport and interaction tests
        run: npx -y @playwright/test@1.55.0 test .github/scripts/final-smoke.spec.js --reporter=line --workers=1

      - name: Remove temporary finalization files
        run: rm .github/workflows/finalize-metatrends.yml .github/scripts/finalize_metatrends.py .github/scripts/final-smoke.spec.js

      - name: Commit and push
        run: |
          git add -A
          git commit -m "Finalize audited Meta Trends presentation"
          git push origin HEAD:feature/consulting-implications
