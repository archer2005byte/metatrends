name: Rework thesis reveals

on:
  push:
    branches:
      - feature/consulting-implications

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/consulting-implications

      - name: Replace supporting reveals
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          text = path.read_text()

          evidence_start = text.index('        <div className="evidence-overlay" aria-live="polite">')
          evidence_end = text.index('\n      </section>', evidence_start)
          evidence = '''        <div className="evidence-overlay threshold-overlay" aria-live="polite">
          <div className="threshold-head"><span>CAPABILITY THRESHOLDS</span><b>answer → reason → see → act → persist → coordinate</b></div>
          <div className="threshold-track">
            <article className="threshold-step threshold-1"><small>01 / LANGUAGE</small><h3>ANSWER</h3><p>Questions become conversational.</p></article>
            <article className="threshold-step threshold-2"><small>02 / INFERENCE</small><h3>REASON</h3><p>Multi-step problems become tractable.</p></article>
            <article className="threshold-step threshold-3"><small>03 / PERCEPTION</small><h3>SEE</h3><p>Models read images, audio and the world.</p></article>
            <article className="threshold-step threshold-4"><small>04 / AGENCY</small><h3>ACT</h3><p>Tools, code and workflows move under machine control.</p></article>
            <article className="threshold-step threshold-5"><small>05 / DURATION</small><h3>PERSIST</h3><p>Longer tasks survive beyond a single prompt.</p></article>
            <article className="threshold-step threshold-6"><small>06 / COLLECTIVE</small><h3>COORDINATE</h3><p>Agents share discoveries, reuse work and organise.</p></article>
          </div>
          <p className="threshold-thesis">There was no single crossing.<br /><em>There was a sequence of thresholds.</em></p>
        </div>'''
          text = text[:evidence_start] + evidence + text[evidence_end:]

          commodity_start = text.index('<div className="commodity-overlay" aria-live="polite">')
          commodity_end = text.index('</section>', commodity_start)
          abundance = '''<div className="commodity-overlay abundance-overlay" aria-live="polite">
            <div className="abundance-head"><span>INTELLIGENCE / THE ECONOMICS</span><b>scarce → abundant</b></div>
            <div className="abundance-flow">
              <article className="abundance-step abundance-conserve"><small>01 / SCARCE</small><h3>CONSERVE</h3><div className="abundance-glyph glyph-conserve"><i /></div><p>Expensive intelligence is protected, queued and rationed.</p></article>
              <article className="abundance-step abundance-replicate"><small>02 / COPIES</small><h3>REPLICATE</h3><div className="abundance-glyph glyph-replicate"><i /><i /><i /><i /><i /><i /></div><p>The same capability can be instantiated again and again.</p></article>
              <article className="abundance-step abundance-parallel"><small>03 / SIMULTANEITY</small><h3>PARALLELISE</h3><div className="abundance-glyph glyph-parallel"><i /><i /><i /><i /></div><p>Many approaches can run at the same time.</p></article>
              <article className="abundance-step abundance-waste"><small>04 / ABUNDANCE</small><h3>WASTE</h3><div className="abundance-glyph glyph-waste"><i /><i /><i /><i /><i /><i /><b /></div><p>Retries, dead ends and disposable attempts become economical.</p></article>
            </div>
            <p className="abundance-thesis">When intelligence becomes cheap enough,<br /><em>you stop conserving it and start wasting it.</em></p>
          </div>'''
          text = text[:commodity_start] + abundance + text[commodity_end:]
          path.write_text(text)

          styles = Path('src/styles.css')
          s = styles.read_text()
          imp = '@import "./styles/presentation-thesis-reveals.css";'
          if imp not in s:
              marker = '@import "./styles/presentation-interaction.css";'
              s = s.replace(marker, marker + '\n' + imp)
              styles.write_text(s)

          css = r'''/* Distinct supporting reveals for the two opening theses. */
.evidence-overlay.threshold-overlay{display:flex!important;flex-direction:column!important;justify-content:flex-start!important;inset:8% 5.5%!important;padding:28px 30px 30px!important;background:rgba(17,19,23,.985)!important;border:1px solid rgba(215,255,79,.38)!important;color:var(--paper)!important;overflow:hidden!important}
.threshold-head,.abundance-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid rgba(242,239,231,.22);font:11px 'DM Mono',monospace;letter-spacing:.11em;text-transform:uppercase}.threshold-head span,.abundance-head span{color:#b8bab2}.threshold-head b,.abundance-head b{color:var(--lime);font-weight:500}
.threshold-track{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;flex:1;margin:28px 0 18px;padding:0 4px 20px}.threshold-track:before{content:"";position:absolute;left:3%;right:3%;bottom:34px;height:2px;background:linear-gradient(90deg,#4e524a,var(--lime));transform:rotate(-6deg);transform-origin:left center;opacity:.75}.threshold-step{position:relative;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;min-width:0;padding:16px 13px;border-left:1px solid rgba(215,255,79,.27);background:rgba(242,239,231,.025)}.threshold-step:after{content:"";position:absolute;left:-5px;bottom:-8px;width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 18px rgba(215,255,79,.6)}.threshold-1{height:38%}.threshold-2{height:48%}.threshold-3{height:58%}.threshold-4{height:69%}.threshold-5{height:80%}.threshold-6{height:92%;background:rgba(215,255,79,.08);border-color:var(--lime)}.threshold-step small{font:9px 'DM Mono',monospace;color:#8e9187;letter-spacing:.08em}.threshold-step h3{margin:10px 0 12px;font:650 clamp(23px,2.5vw,38px)/.9 'Space Grotesk',sans-serif;letter-spacing:-.07em;color:var(--paper)}.threshold-6 h3{color:var(--lime)}.threshold-step p{margin:0;font:500 clamp(11px,1.05vw,15px)/1.18 'Manrope',sans-serif;color:#aeb0a8}.threshold-thesis{margin:0;font:500 clamp(28px,3.7vw,54px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.055em;color:var(--paper)}.threshold-thesis em{font-style:normal;color:var(--lime)}
.commodity-overlay.abundance-overlay{display:flex!important;flex-direction:column!important;justify-content:flex-start!important;inset:8% 4.7%!important;padding:28px 30px 30px!important;background:rgba(17,19,23,.985)!important;border:1px solid rgba(17,19,23,.45)!important;color:var(--paper)!important;overflow:hidden!important}.abundance-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex:1;margin:26px 0 18px}.abundance-step{position:relative;display:flex;flex-direction:column;min-width:0;padding:20px 18px;border:1px solid rgba(242,239,231,.17);background:rgba(242,239,231,.035)}.abundance-step:after{content:"→";position:absolute;right:-18px;top:47%;z-index:3;color:var(--lime);font:28px 'DM Mono',monospace}.abundance-step:last-child:after{display:none}.abundance-step small{font:9px 'DM Mono',monospace;letter-spacing:.09em;color:#92958a}.abundance-step h3{margin:14px 0 18px;font:650 clamp(27px,3vw,46px)/.9 'Space Grotesk',sans-serif;letter-spacing:-.07em}.abundance-step p{margin:auto 0 0;color:#b5b7af;font:500 clamp(12px,1.1vw,16px)/1.25 'Manrope',sans-serif}.abundance-waste{background:var(--lime);color:var(--ink);border-color:var(--lime)}.abundance-waste small,.abundance-waste p{color:var(--ink)}
.abundance-glyph{height:128px;position:relative;margin:4px 0 18px;border-bottom:1px solid rgba(242,239,231,.17)}.abundance-glyph i,.abundance-glyph b{position:absolute;display:block;background:var(--lime);font-style:normal}.glyph-conserve i{width:42px;height:42px;border-radius:50%;left:50%;top:33%;transform:translate(-50%,-50%);box-shadow:0 0 28px rgba(215,255,79,.34)}.glyph-replicate{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px;padding:12px 28px}.glyph-replicate i{position:relative;width:24px;height:24px;border-radius:50%;place-self:center}.glyph-parallel{display:flex;gap:10px;align-items:center;padding:12px 8px}.glyph-parallel i{position:relative;flex:1;height:8px;border-radius:5px}.glyph-parallel i:nth-child(1){width:55%}.glyph-parallel i:nth-child(2){width:82%}.glyph-parallel i:nth-child(3){width:66%}.glyph-parallel i:nth-child(4){width:94%}.abundance-waste .abundance-glyph{border-color:rgba(17,19,23,.25)}.glyph-waste{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:11px;padding:12px 28px}.glyph-waste i{position:relative;width:23px;height:23px;border-radius:50%;place-self:center;background:var(--ink);opacity:.18}.glyph-waste i:nth-child(2),.glyph-waste i:nth-child(5){opacity:.42}.glyph-waste b{width:27px;height:27px;border-radius:50%;right:13%;bottom:18%;background:var(--ink);box-shadow:0 0 0 8px rgba(17,19,23,.08)}.abundance-thesis{margin:0;font:500 clamp(28px,3.7vw,54px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.055em;color:var(--paper)}.abundance-thesis em{font-style:normal;color:var(--lime)}
@media(max-width:900px){.threshold-track{grid-template-columns:repeat(3,1fr);align-items:stretch}.threshold-track:before{display:none}.threshold-step{height:auto!important;min-height:135px}.abundance-flow{grid-template-columns:1fr 1fr}.abundance-step:after{display:none}.abundance-glyph{height:82px}}
'''
          Path('src/styles/presentation-thesis-reveals.css').write_text(css)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/rework-thesis-reveals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/styles.css src/styles/presentation-thesis-reveals.css .github/workflows/rework-thesis-reveals.yml
          git commit -m "Redesign opening thesis reveals"
          git push origin HEAD:feature/consulting-implications
