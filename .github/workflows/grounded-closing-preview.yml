name: Preview grounded closing

on:
  push:
    branches:
      - feature/grounded-closing

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/grounded-closing
          path: preview-src

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Build production site
        working-directory: production
        env:
          GITHUB_PAGES_BASE: /metatrends/
        run: |
          bun install --no-frozen-lockfile
          bunx vite build --config vite.gh.config.ts
          if [ -f dist-gh/index.gh.html ]; then mv dist-gh/index.gh.html dist-gh/index.html; fi
          cp dist-gh/index.html dist-gh/404.html
          mkdir -p dist-gh/resources
          cp dist-gh/index.html dist-gh/resources/index.html
          cp -r public/. dist-gh/ 2>/dev/null || true
          touch dist-gh/.nojekyll

      - name: Build branch preview
        working-directory: preview-src
        env:
          GITHUB_PAGES_BASE: /metatrends/preview/grounded-closing/
        run: |
          bun install --no-frozen-lockfile
          bunx vite build --config vite.gh.config.ts
          if [ -f dist-gh/index.gh.html ]; then mv dist-gh/index.gh.html dist-gh/index.html; fi
          cp dist-gh/index.html dist-gh/404.html
          mkdir -p dist-gh/resources
          cp dist-gh/index.html dist-gh/resources/index.html
          cp -r public/. dist-gh/ 2>/dev/null || true
          touch dist-gh/.nojekyll

      - name: Add branch preview under production artifact
        run: |
          mkdir -p production/dist-gh/preview/grounded-closing
          cp -r preview-src/dist-gh/. production/dist-gh/preview/grounded-closing/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: production/dist-gh

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
